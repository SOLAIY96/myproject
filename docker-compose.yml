services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db
      - rabbitmq
      - redis

  celery_worker:
    build: .
    command: celery -A learnhub worker -l info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db
      - rabbitmq
      - redis

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: taskapi_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7-alpine
    container_name: learnhub-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
